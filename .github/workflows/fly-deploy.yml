# Optional manual deployment from GitHub. Requires Fly app/volume and
# repository secret FLY_API_TOKEN to be configured by the repository owner.
name: Deploy to Fly.io
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fly-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
