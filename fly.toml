# fly.toml app configuration file generated for dnd-with-scheduler on 2026-10-30T19:13:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dnd-with-scheduler'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/scheduler.db'
  TZ_NAME = 'America/Chicago'

[[mounts]]
  source = 'scheduler_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[restart]]
  policy = "always"
  processes = ["app"]
